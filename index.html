<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirjanpito - Kaikki laskut</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        h1 { color: #1a73e8; text-align: center; font-size: 1.2rem; }
        
        .lasku-rivi { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid #eee;
        }
        .lasku-info { flex-grow: 1; }
        .lasku-nimi { font-weight: bold; font-size: 1.1rem; display: block; }
        
        input[type="date"] { border: 1px solid #1a73e8; padding: 5px; border-radius: 4px; margin-top: 5px; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 15px; }
        
        .summa { font-weight: bold; font-size: 1.1rem; margin: 0 10px; min-width: 80px; text-align: right; }
        .nappi-poista { background: none; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        
        .total-box { margin-top: 20px; padding: 15px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 8px; text-align: right; }
        .total-summa { font-size: 1.4rem; color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Kaikki tallennetut laskut</h1>
    <p style="font-size: 0.9rem; color: #666;">Päivitä huhtikuun päivämäärät suoraan listaan.</p>

    <div id="lista"></div>

    <div class="total-box">
        Maksamatta huhtikuussa: <span class="total-summa" id="yhteensa">0.00</span> €
    </div>
</div>

<script>
    let laskut = JSON.parse(localStorage.getItem('bills')) || [];

    function tallennaJaNayta() {
        localStorage.setItem('bills', JSON.stringify(laskut));
        paivitaNakyma();
    }

    function muutaPaiva(id, uusiPaiva) {
        const lasku = laskut.find(l => l.id === id);
        if (lasku) {
            lasku.dueDate = uusiPaiva;
            lasku.paid = false; // Kun muutat päivän huhtikuulle, ruksi poistuu automaattisesti
            tallennaJaNayta();
        }
    }

    function muutaStatus(id) {
        const lasku = laskut.find(l => l.id === id);
        if (lasku) {
            lasku.paid = !lasku.paid;
            tallennaJaNayta();
        }
    }

    function poistaLasku(id) {
        if(confirm("Poistetaanko lasku listalta?")) {
            laskut = laskut.filter(l => l.id !== id);
            tallennaJaNayta();
        }
    }

    function paivitaNakyma() {
        const listaElementti = document.getElementById('lista');
        listaElementti.innerHTML = '';
        let summa = 0;

        // Järjestetään päivän mukaan (vanhimmat eli tammikuu ensin)
        laskut.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

        laskut.forEach(l => {
            const rivi = document.createElement('div');
            rivi.className = 'lasku-rivi';
            if (l.paid) rivi.style.opacity = '0.5';

            rivi.innerHTML = `
                <input type="checkbox" ${l.paid ? 'checked' : ''} onclick="muutaStatus(${l.id})">
                <div class="lasku-info">
                    <span class="lasku-nimi">${l.provider}</span>
                    <input type="date" value="${l.dueDate}" onchange="muutaPaiva(${l.id}, this.value)">
                </div>
                <div class="summa">${l.amount.toFixed(2)} €</div>
                <button class="nappi-poista" onclick="poistaLasku(${l.id})">✕</button>
            `;
            listaElementti.appendChild(rivi);

            if (!l.paid) summa += l.amount;
        });

        document.getElementById('yhteensa').innerText = summa.toFixed(2);
    }

    paivitaNakyma();
</script>
</body>
</html>
